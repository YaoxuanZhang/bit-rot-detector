[project]
name = "bit-rot-detector"
version = "1.0.0"
description = "Production-grade utility for detecting file corruption (bit rot) using BLAKE3 hashing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blake3>=0.4.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
bit-rot-detector = "bit_rot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bit_rot"]

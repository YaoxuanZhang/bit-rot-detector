<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bit Rot Detector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2e3147;
      --accent:  #6366f1;
      --ok:      #22c55e;
      --warn:    #f59e0b;
      --err:     #ef4444;
      --text:    #e2e8f0;
      --muted:   #6b7280;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; }
    header .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
    }

    /* ── Tabs ── */
    .tabs {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      padding: 0 2rem;
      gap: 0;
    }
    .tab {
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      cursor: pointer;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      border-radius: 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

    .toolbar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: var(--border); }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover { background: #4f52d9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .status-bar .item { display: flex; flex-direction: column; gap: 0.2rem; }
    .status-bar .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .status-bar .value { font-size: 0.95rem; font-weight: 500; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.ok   { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.err  { background: var(--err); }
    .dot.idle { background: var(--muted); }
    .dot.running { background: var(--accent); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* ── Progress card ── */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    .progress-card h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .progress-label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
    .progress-track { background: var(--bg); border-radius: 999px; height: 8px; overflow: hidden; margin-bottom: 0.5rem; }
    .progress-fill  { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.3s; }
    .progress-phases { display: flex; gap: 1rem; flex-wrap: wrap; }
    .phase-badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .phase-badge.active { border-color: var(--accent); color: var(--accent); }
    .phase-badge.done   { border-color: var(--ok);     color: var(--ok); }

    .drives { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }

    .drive-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .drive-card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.4rem; }
    .drive-card .path { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; word-break: break-all; }
    .drive-meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.75rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .drive-meta span { display: flex; align-items: center; gap: 0.3rem; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .stat { background: var(--bg); border-radius: 6px; padding: 0.5rem 0.75rem; }
    .stat .slab { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .stat .sval { font-size: 1rem; font-weight: 600; margin-top: 0.1rem; }

    .error-box {
      margin-top: 0.75rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      color: var(--err);
    }

    .corrupt-list {
      margin-top: 0.75rem;
      font-size: 0.8rem;
    }
    .corrupt-list summary { cursor: pointer; color: var(--err); }
    .corrupt-list ul { margin-top: 0.5rem; padding-left: 1.25rem; }
    .corrupt-list li { margin-bottom: 0.25rem; word-break: break-all; color: var(--text); }

    .disk-bar { margin-top: 0.75rem; }
    .disk-bar .bar-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.3rem; }
    .disk-bar .track { background: var(--bg); border-radius: 999px; height: 6px; overflow: hidden; }
    .disk-bar .fill  { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.4s; }
    .disk-bar .fill.warn { background: var(--warn); }
    .disk-bar .fill.err  { background: var(--err); }

    /* ── History tab ── */
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .chart-card h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 1rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .chart-card canvas { max-height: 220px; }

    .history-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 0.65rem; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .empty { color: var(--muted); font-size: 0.9rem; padding: 2rem 0; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 9999; }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      animation: slideIn 0.2s ease;
      max-width: 360px;
    }
    .toast.ok   { border-left: 3px solid var(--ok); }
    .toast.err  { border-left: 3px solid var(--err); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <h1>Bit Rot Detector</h1>
    <span class="badge">v1</span>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showTab('status')">Status</button>
    <button class="tab" onclick="showTab('history')">History</button>
  </div>

  <main>
    <!-- ── Status Tab ── -->
    <div class="tab-panel active" id="tab-status">
      <div class="toolbar">
        <button class="primary" id="btn-sync" onclick="triggerOp('sync')">⟳ Sync All</button>
        <button id="btn-scrub" onclick="triggerOp('scrub')">🔍 Scrub All</button>
        <button id="btn-refresh" onclick="refresh()">↺ Refresh</button>
      </div>

      <div class="status-bar" id="status-bar">
        <div class="item">
          <span class="label">State</span>
          <span class="value" id="state-val"><span class="dot idle"></span>Loading…</span>
        </div>
        <div class="item">
          <span class="label">Last Run</span>
          <span class="value" id="last-run-val">—</span>
        </div>
        <div class="item">
          <span class="label">Duration</span>
          <span class="value" id="duration-val">—</span>
        </div>
        <div class="item">
          <span class="label">Drives</span>
          <span class="value" id="drive-count-val">—</span>
        </div>
      </div>

      <!-- Live progress card (shown during operations) -->
      <div class="progress-card" id="progress-card" style="display:none">
        <h3><span class="spinner"></span>Scanning in progress</h3>
        <div class="progress-label" id="progress-label">Initializing…</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <div class="progress-phases">
          <span class="phase-badge" id="phase-walk">Walk</span>
          <span class="phase-badge" id="phase-hash">Hash</span>
          <span class="phase-badge" id="phase-scrub">Scrub</span>
        </div>
      </div>

      <div class="drives" id="drives-grid">
        <p class="empty">Loading drive data…</p>
      </div>
    </div>

    <!-- ── History Tab ── -->
    <div class="tab-panel" id="tab-history">
      <div class="toolbar">
        <button id="btn-history-refresh" onclick="loadHistory()">↺ Refresh</button>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>Files Over Time</h3>
          <canvas id="chart-files"></canvas>
        </div>
        <div class="chart-card">
          <h3>Corruption Detections</h3>
          <canvas id="chart-corruption"></canvas>
        </div>
        <div class="chart-card">
          <h3>Run Duration (seconds)</h3>
          <canvas id="chart-duration"></canvas>
        </div>
      </div>

      <div class="history-table-wrap">
        <table id="history-table">
          <thead>
            <tr>
              <th>Drive</th><th>Started</th><th>Duration</th>
              <th>Scanned</th><th>Added</th><th>Modified</th><th>Removed</th>
              <th>Validated</th><th>Corrupted</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="9" class="empty">Loading history…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <!-- Chart.js loaded from CDN; charts are disabled gracefully if unavailable -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // ── Shared state ────────────────────────────────────────────────────────
    let pollTimer   = null;
    let wasRunning  = false;
    let sseSource   = null;
    let phaseState  = {};  // phase → "active" | "done"
    let chartFiles, chartCorruption, chartDuration;

    const FETCH_TIMEOUT_MS = 15000;
    const ALLOWED_OPS = new Set(['sync', 'scrub']);

    // ── Helpers ─────────────────────────────────────────────────────────────
    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function apiFetch(path, method = 'GET') {
      const ctrl = new AbortController();
      const tid  = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
      try {
        const r = await fetch(path, { method, signal: ctrl.signal });
        clearTimeout(tid);
        if (r.status === 409) {
          const body = await r.json().catch(() => ({}));
          const e = new Error(body.error || 'an operation is already running');
          e.status = 409;
          throw e;
        }
        if (!r.ok) {
          const e = new Error(`HTTP ${r.status}`);
          e.status = r.status;
          throw e;
        }
        return r.json();
      } catch (e) {
        clearTimeout(tid);
        throw e;
      }
    }

    function fmtBytes(b) {
      if (!b) return '—';
      const units = ['B','KB','MB','GB','TB','PB'];
      let i = 0;
      while (b >= 1024 && i < units.length - 1) { b /= 1024; i++; }
      return `${b.toFixed(1)} ${units[i]}`;
    }

    function fmtTime(iso) {
      if (!iso || iso === '0001-01-01T00:00:00Z') return 'Never';
      return new Date(iso).toLocaleString();
    }

    function fmtMs(ms) {
      if (!ms) return '—';
      if (ms < 1000) return `${ms}ms`;
      if (ms < 60000) return `${(ms/1000).toFixed(1)}s`;
      return `${Math.floor(ms/60000)}m ${Math.round((ms%60000)/1000)}s`;
    }

    function toast(msg, type = 'ok') {
      const c = document.getElementById('toasts');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function setButtons(disabled) {
      ['btn-sync','btn-scrub','btn-refresh'].forEach(id => {
        document.getElementById(id).disabled = disabled;
      });
    }

    // ── Tabs ─────────────────────────────────────────────────────────────────
    function showTab(name) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${name}`).classList.add('active');
      document.querySelectorAll('.tab').forEach(t => {
        if (t.textContent.toLowerCase().startsWith(name)) t.classList.add('active');
      });
      if (name === 'history') loadHistory();
    }

    // ── SSE Progress ─────────────────────────────────────────────────────────
    function startSSE() {
      if (sseSource) { sseSource.close(); sseSource = null; }
      phaseState = {};
      ['walk','hash','scrub'].forEach(p => setPhase(p, ''));

      document.getElementById('progress-card').style.display = '';
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('progress-label').textContent = 'Initializing…';

      sseSource = new EventSource('/api/progress');
      sseSource.onmessage = function(e) {
        try {
          const ev = JSON.parse(e.data);
          handleProgressEvent(ev);
        } catch(_) {}
      };
      sseSource.onerror = function() {
        sseSource.close(); sseSource = null;
      };
    }

    function stopSSE() {
      if (sseSource) { sseSource.close(); sseSource = null; }
      document.getElementById('progress-card').style.display = 'none';
    }

    function setPhase(name, state) {
      const el = document.getElementById(`phase-${name}`);
      if (!el) return;
      el.className = 'phase-badge' + (state ? ` ${state}` : '');
      phaseState[name] = state;
    }

    function handleProgressEvent(ev) {
      const phases = ['walk','hash','scrub'];
      const pct = ev.total > 0 ? Math.min(99, Math.round(ev.count / ev.total * 100)) : null;

      if (ev.phase === 'done') {
        // Mark any active phase as done and advance fill to 100%.
        phases.forEach(p => { if (phaseState[p] === 'active') setPhase(p, 'done'); });
        document.getElementById('progress-fill').style.width = '100%';
        document.getElementById('progress-label').textContent = 'Complete!';
        return;
      }

      // Activate current phase; mark all prior phases as done.
      const idx = phases.indexOf(ev.phase);
      phases.forEach((p, i) => {
        if (i < idx)        setPhase(p, 'done');
        else if (i === idx) setPhase(p, 'active');
      });

      const countStr = ev.count.toLocaleString();
      const totalStr = ev.total > 0 ? ` / ${ev.total.toLocaleString()}` : '';
      document.getElementById('progress-label').textContent =
        `${ev.phase.charAt(0).toUpperCase()+ev.phase.slice(1)}: ${countStr}${totalStr} files  ·  ${esc(ev.drive)}`;

      // Approximate total progress (walk=0-33%, hash=33-66%, scrub=66-99%).
      const base = idx * 33;
      const range = 33;
      const fill = pct != null ? base + Math.round(pct * range / 100) : base + 5;
      document.getElementById('progress-fill').style.width = `${fill}%`;
    }

    // ── Status rendering ─────────────────────────────────────────────────────
    function renderStatus(st) {
      const stateEl = document.getElementById('state-val');
      const justFinished = wasRunning && !st.running;
      wasRunning = st.running;

      if (st.running) {
        stateEl.innerHTML = `<span class="spinner"></span><span class="dot running"></span>Running`;
        setButtons(true);
        schedulePoll(1500);
      } else {
        const hasErr    = (st.drives || []).some(d => d.err);
        const hasBitRot = (st.drives || []).some(d => d.scrub_result && (d.scrub_result.files_corrupted || []).length > 0);
        let dot, label;
        if (hasErr)         { dot = 'err';  label = 'Error'; }
        else if (hasBitRot) { dot = 'err';  label = 'Bit Rot Detected'; }
        else if (st.last_run && st.last_run !== '0001-01-01T00:00:00Z') { dot = 'ok'; label = 'OK'; }
        else                { dot = 'idle'; label = 'Idle'; }
        stateEl.innerHTML = `<span class="dot ${dot}"></span>${label}`;
        setButtons(false);
        clearTimeout(pollTimer);
        stopSSE();

        if (justFinished) {
          if (hasBitRot)   toast('⚠ Bit rot detected!', 'err');
          else if (hasErr) toast('Operation completed with errors', 'err');
          else             toast('Operation completed successfully', 'ok');
        }
      }
      document.getElementById('last-run-val').textContent = fmtTime(st.last_run);
      document.getElementById('duration-val').textContent = st.duration || '—';
      document.getElementById('drive-count-val').textContent = (st.drives || []).length;
      renderDrives(st.drives || []);
    }

    function renderDrives(drives) {
      const grid = document.getElementById('drives-grid');
      if (!drives.length) {
        grid.innerHTML = '<p class="empty">No drives configured.</p>';
        return;
      }
      grid.innerHTML = drives.map(d => {
        const sync  = d.sync_result  || {};
        const scrub = d.scrub_result || {};
        const h     = d.health       || {};

        // Drive type badge
        const driveType = h.is_rotational ? '💽 HDD' : '⚡ SSD';
        const smartBadge = h.smart_status && h.smart_status !== 'UNKNOWN'
          ? `<span style="color:${h.smart_status==='PASSED'?'var(--ok)':'var(--err)'}">${esc(h.smart_status)}</span>`
          : '';

        let diskBar = '';
        if (h.total_space) {
          const pct = Math.round((h.used_space / h.total_space) * 100);
          const cls = pct > 90 ? 'err' : pct > 75 ? 'warn' : '';
          diskBar = `
            <div class="disk-bar">
              <div class="bar-label">Disk: ${fmtBytes(h.used_space)} / ${fmtBytes(h.total_space)} (${pct}%)</div>
              <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>
            </div>`;
        }

        let corruptBlock = '';
        if (scrub.files_corrupted && scrub.files_corrupted.length) {
          const items = scrub.files_corrupted.map(p => `<li>${esc(p)}</li>`).join('');
          corruptBlock = `<details class="corrupt-list"><summary>⚠ ${scrub.files_corrupted.length} corrupted file(s)</summary><ul>${items}</ul></details>`;
        }

        const errBlock = d.err ? `<div class="error-box">${esc(d.err)}</div>` : '';

        return `
          <div class="drive-card">
            <h2>${esc(d.drive)}</h2>
            <div class="path">${esc(d.path)}</div>
            <div class="drive-meta">
              <span>${driveType}</span>
              ${smartBadge ? `<span>${smartBadge}</span>` : ''}
            </div>
            <div class="stat-grid">
              <div class="stat"><div class="slab">Scanned</div><div class="sval">${sync.files_scanned ?? '—'}</div></div>
              <div class="stat"><div class="slab">Added</div><div class="sval">${sync.files_added ?? '—'}</div></div>
              <div class="stat"><div class="slab">Modified</div><div class="sval">${sync.files_modified ?? '—'}</div></div>
              <div class="stat"><div class="slab">Removed</div><div class="sval">${sync.files_removed ?? '—'}</div></div>
              <div class="stat"><div class="slab">Validated</div><div class="sval">${scrub.files_validated ?? '—'}</div></div>
              <div class="stat"><div class="slab">Corrupted</div><div class="sval" style="color:${(scrub.files_corrupted||[]).length>0?'var(--err)':'inherit'}">${(scrub.files_corrupted||[]).length}</div></div>
            </div>
            ${diskBar}
            ${corruptBlock}
            ${errBlock}
          </div>`;
      }).join('');
    }

    function schedulePoll(ms) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(refresh, ms);
    }

    async function refresh() {
      try {
        const st = await apiFetch('/api/status');
        renderStatus(st);
      } catch(e) {
        toast(`Refresh failed: ${esc(e.message)}`, 'err');
      }
    }

    async function triggerOp(op) {
      if (!ALLOWED_OPS.has(op)) { console.error('triggerOp: unexpected op', op); return; }
      setButtons(true);
      document.getElementById('state-val').innerHTML =
        `<span class="spinner"></span><span class="dot running"></span>Starting ${esc(op)}…`;
      try {
        await apiFetch(`/api/${op}`, 'POST');
        wasRunning = true;
        startSSE();
        schedulePoll(500);
      } catch(e) {
        toast(e.status === 409 ? e.message : `${op} failed: ${esc(e.message)}`, 'err');
        refresh();
      }
    }

    // ── History tab ─────────────────────────────────────────────────────────
    let chartsReady = false;

    function initCharts() {
      if (chartsReady || typeof Chart === 'undefined') return;
      chartsReady = true;
      Chart.defaults.color = '#6b7280';
      Chart.defaults.borderColor = '#2e3147';
      const baseOpts = {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { maxTicksLimit: 8, maxRotation: 0 } },
          y: { beginAtZero: true }
        }
      };

      chartFiles = new Chart(document.getElementById('chart-files'), {
        type: 'bar',
        data: { labels: [], datasets: [
          { label: 'Added',    data: [], backgroundColor: '#22c55e88' },
          { label: 'Modified', data: [], backgroundColor: '#f59e0b88' },
          { label: 'Removed',  data: [], backgroundColor: '#ef444488' },
        ]},
        options: { ...baseOpts, plugins: { legend: { display: true, labels: { color: '#6b7280' } } },
          scales: { x: { stacked: true, ticks:{maxTicksLimit:8,maxRotation:0} }, y: { stacked: true, beginAtZero: true } }}
      });

      chartCorruption = new Chart(document.getElementById('chart-corruption'), {
        type: 'line',
        data: { labels: [], datasets: [
          { label: 'Corrupted', data: [], borderColor: '#ef4444', backgroundColor: '#ef444422',
            tension: 0.3, fill: true, pointRadius: 3 },
        ]},
        options: { ...baseOpts, plugins: { legend: { display: false } } }
      });

      chartDuration = new Chart(document.getElementById('chart-duration'), {
        type: 'bar',
        data: { labels: [], datasets: [
          { label: 'Duration (s)', data: [], backgroundColor: '#6366f188' },
        ]},
        options: { ...baseOpts }
      });
    }

    async function loadHistory() {
      try {
        const recs = await apiFetch('/api/history?limit=30');
        renderHistory(recs || []);
      } catch(e) {
        document.getElementById('history-tbody').innerHTML =
          `<tr><td colspan="9" class="empty">Failed to load: ${esc(e.message)}</td></tr>`;
      }
    }

    function renderHistory(recs) {
      // Sort ascending for charts, latest first for table
      const asc  = [...recs].sort((a,b) => new Date(a.started_at) - new Date(b.started_at));
      const desc = [...recs].sort((a,b) => new Date(b.started_at) - new Date(a.started_at));

      // Table
      const tbody = document.getElementById('history-tbody');
      if (!desc.length) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">No history yet — run a sync or scrub first.</td></tr>';
      } else {
        tbody.innerHTML = desc.map(r => `
          <tr>
            <td>${esc(r.drive_name)}</td>
            <td>${fmtTime(r.started_at)}</td>
            <td>${fmtMs(r.duration_ms)}</td>
            <td>${r.files_scanned}</td>
            <td>${r.files_added}</td>
            <td>${r.files_modified}</td>
            <td>${r.files_removed}</td>
            <td>${r.files_validated}</td>
            <td style="color:${r.files_corrupted>0?'var(--err)':'inherit'}">${r.files_corrupted}</td>
          </tr>`).join('');
      }

      // Charts (skip if Chart.js not loaded)
      if (typeof Chart === 'undefined') return;
      initCharts();

      const labels  = asc.map(r => new Date(r.started_at).toLocaleDateString());
      chartFiles.data.labels = labels;
      chartFiles.data.datasets[0].data = asc.map(r => r.files_added);
      chartFiles.data.datasets[1].data = asc.map(r => r.files_modified);
      chartFiles.data.datasets[2].data = asc.map(r => r.files_removed);
      chartFiles.update();

      chartCorruption.data.labels = labels;
      chartCorruption.data.datasets[0].data = asc.map(r => r.files_corrupted);
      chartCorruption.update();

      chartDuration.data.labels = labels;
      chartDuration.data.datasets[0].data = asc.map(r => +(r.duration_ms/1000).toFixed(2));
      chartDuration.update();
    }

    // Initial load
    refresh();
  </script>
</body>
</html>

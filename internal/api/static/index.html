<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bit Rot Detector</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0f1117; --surface: #1a1d27; --border: #2e3147;
        --accent: #6366f1; --text: #e2e8f0; --muted: #6b7280;
      }
      body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
      header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
      header h1 { font-size: 1.25rem; font-weight: 600; }
      .badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px; background: var(--accent); color: #fff; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; max-width: 480px; width: 100%; text-align: center; }
      .card h2 { font-size: 1.1rem; margin-bottom: 1rem; }
      .card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.6rem; }
      code { background: rgba(255,255,255,0.08); padding: 0.15rem 0.4rem; border-radius: 4px; font-family: monospace; }
    </style>
  </head>
  <body>
    <header>
      <span>🔍</span>
      <h1>Bit Rot Detector</h1>
      <span class="badge">UI not built</span>
    </header>
    <main>
      <div class="card">
        <h2>React UI not built yet</h2>
        <p>Run the following command to build the full dashboard:</p>
        <p><code>make ui</code></p>
        <p>Or for development with hot-reload:</p>
        <p><code>make ui-dev</code></p>
      </div>
    </main>
  </body>
</html>

name: Docker Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production-standard tagging strategy:
      #   v1.2.3 tag  →  :1.2.3  :1.2  :1 (stable only)  :latest (stable only)
      #   branch push →  :<branch-name>
      #   every event →  :sha-<short-sha>  (immutable, always present)
      #
      # "Stable" means a semver tag without a pre-release suffix (e.g. v1.0.0,
      # not v1.0.0-alpha.1 or v0.x.x).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Exact version tag: v1.2.3 → 1.2.3
            type=semver,pattern={{version}}
            # Rolling minor: v1.2.3 → 1.2
            type=semver,pattern={{major}}.{{minor}}
            # Rolling major: v1.2.3 → 1  (skipped for v0.x to avoid premature stability signal)
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # latest: only on stable releases (no pre-release suffix, not v0.x)
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && !startsWith(github.ref, 'refs/tags/v0.') }}
            # Branch tip: main → main, develop → develop
            type=ref,event=branch
            # Immutable SHA tag present on every build for exact reproducibility
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Push on branch/tag events; PR builds validate only (no push)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
